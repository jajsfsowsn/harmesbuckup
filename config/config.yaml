model:
  default: memo2.5
  provider: custom
  base_url: https://9router-production-9013.up.railway.app/v1
  api_key: ${HERMES_CUSTOM_9ROUTER_PRODUCTION_9013_UP_RAILWAY_APP_API_KEY}
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.85
command_allowlist:
  - script execution via -e/-c flag
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 33
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '6202707152'
      name: Mehrdadㅤ
      user_id: '6202707152'
custom_providers:
  - name: 9router-production-9013.up.railway.app
    base_url: https://9router-production-9013.up.railway.app/v1
    key_env: HERMES_CUSTOM_9ROUTER_PRODUCTION_9013_UP_RAILWAY_APP_API_KEY
    model: memo2.5
