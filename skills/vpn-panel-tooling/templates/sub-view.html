<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVPN - اطلاعات اشتراک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0c10;--card:#181c25;--card2:#1e2330;--accent:#6c5ce7;--green:#00d2a0;--text:#f0f2f5;--muted:#8b95a5;--border:rgba(255,255,255,0.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:440px;width:100%;margin:0 auto;padding:16px}
.header{text-align:center;padding:32px 0 24px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;box-shadow:0 8px 32px rgba(108,92,231,0.35)}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#fff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:13px}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card);border-radius:16px;margin-bottom:14px;border:1px solid var(--border)}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(0,210,160,0.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.status-text{font-size:14px;color:var(--green);font-weight:600}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;border:1px solid var(--border)}
.card-title{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.qr-box{display:flex;justify-content:center;padding:16px 0}
.qr-box canvas{border-radius:16px;padding:12px;background:#fff}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--card2);border-radius:14px;padding:14px;border:1px solid var(--border)}
.info-item .label{font-size:11px;color:var(--muted);margin-bottom:6px}
.info-item .value{font-size:14px;font-weight:600;direction:ltr;text-align:left}
.info-item.full{grid-column:1/-1}
.config-box{background:var(--bg);border-radius:14px;padding:16px;direction:ltr;text-align:left;font-family:monospace;font-size:11px;color:#a29bfe;word-break:break-all;max-height:100px;overflow-y:auto;border:1px solid var(--border);line-height:1.7}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:'Vazirmatn',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 4px 24px rgba(108,92,231,0.35)}
.btn-copy{background:var(--card2);color:var(--text);border:1px solid var(--border);margin-top:10px}
.app-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app-link{background:var(--card2);border-radius:14px;padding:14px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--border);transition:all 0.3s}
.app-link:hover{border-color:var(--accent);transform:translateY(-2px)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 28px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all 0.4s;z-index:999;font-family:'Vazirmatn',sans-serif}
.toast.show{opacity:1}
.footer{text-align:center;padding:24px 0;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🔐</div>
    <h1>MVPN</h1>
    <p>اطلاعات اشتراک و کانفیگ شما</p>
  </div>
  <div class="status-bar">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="status-dot"></div>
      <span class="status-text">سرور فعال</span>
    </div>
    <span style="font-size:11px;color:var(--muted);background:var(--card2);padding:4px 10px;border-radius:8px">VLESS • Reality • XHTTP</span>
  </div>
  <div class="card">
    <div class="card-title">📱 اسکن QR Code</div>
    <div class="qr-box"><div id="qrcode"></div></div>
    <button class="btn btn-primary" onclick="copyConfig()">📋 کپی لینک اشتراک</button>
  </div>
  <div class="card">
    <div class="card-title">🌐 اطلاعات سرور</div>
    <div class="info-grid" id="serverInfo"></div>
  </div>
  <div class="card">
    <div class="card-title">⚙️ کانفیگ کامل</div>
    <div class="config-box" id="configText"></div>
    <button class="btn btn-copy" onclick="copyConfig()">📋 کپی کانفیگ</button>
  </div>
  <div class="card">
    <div class="card-title">📲 دانلود اپلیکیشن</div>
    <div class="app-links">
      <a class="app-link" href="https://github.com/MatsuriDayo/NekoBoxForAndroid/releases" target="_blank"><div style="font-size:28px;margin-bottom:8px">🐱</div><div style="font-size:12px;font-weight:600">NekoBox</div></a>
      <a class="app-link" href="https://github.com/2dust/v2rayNG/releases" target="_blank"><div style="font-size:28px;margin-bottom:8px">📦</div><div style="font-size:12px;font-weight:600">v2rayNG</div></a>
      <a class="app-link" href="https://github.com/nickmessing/Shadowrocket-Android/releases" target="_blank"><div style="font-size:28px;margin-bottom:8px">🚀</div><div style="font-size:12px;font-weight:600">Shadowrocket</div></a>
      <a class="app-link" href="https://github.com/nickmessing/Shadowrocket-Android/releases" target="_blank"><div style="font-size:28px;margin-bottom:8px">🦊</div><div style="font-size:12px;font-weight:600">FoXray</div></a>
    </div>
  </div>
  <div class="footer">Powered by <span style="color:#a29bfe">MVPN</span> • Heimdall Panel</div>
</div>
<div class="toast" id="toast">✅ با موفقیت کپی شد!</div>
<script>
// VLESS config from panel - auto-generated
const config = "VLESS_CONFIG_PLACEHOLDER";
document.getElementById("configText").textContent = config;
new QRCode(document.getElementById("qrcode"), { text: config, width: 220, height: 220, colorDark: "#1a1d27", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });

// Parse VLESS URL and show server info
const url = new URL(config.replace("vless://", "https://"));
const params = Object.fromEntries(url.searchParams);
const info = [
  ["📡 پروتکل", "VLESS"], ["🔒 امنیت", params.security || "Reality"],
  ["🔗 شبکه", params.type || "xhttp"], ["🔌 پورت", url.port],
  ["🖥️ سرور", url.hostname], ["🏷️ SNI", params.sni || "-"],
  ["🌐 Fingerprint", params.fp || "-"], ["📍 مسیر", params.path || "-"]
];
const grid = document.getElementById("serverInfo");
info.forEach(([label, value], i) => {
  grid.innerHTML += `<div class="info-item${i >= 4 && i <= 5 ? ' full' : ''}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
});

function copyConfig() {
  navigator.clipboard.writeText(config).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  });
}
</script>
</body>
</html>
